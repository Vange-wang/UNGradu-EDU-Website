name = "ungradu-edu-proxy"
main = "cloudflare/worker.ts"
compatibility_date = "2026-07-08"
workers_dev = false

[[routes]]
pattern = "ungraduedu.eu.cc"
custom_domain = true

[[routes]]
pattern = "www.ungraduedu.eu.cc"
custom_domain = true

[[routes]]
pattern = "ungradeedu.eu.cc"
custom_domain = true

[[routes]]
pattern = "www.ungradeedu.eu.cc"
custom_domain = true

[vars]
UPSTREAM_ORIGIN = "https://ungradu-edu-prod-275285-6-1445807473.sh.run.tcloudbase.com"

# ungraduedu.eu.cc is the new canonical public domain.
# Each www hostname redirects to its matching root domain in the Worker.
# Keep the legacy ungradeedu.eu.cc root and www routes for rollback.
# workers.dev public access is disabled; keep the Worker resource and all Custom Domains.
# Do not put secrets in this file. Use Cloudflare Worker variables/secrets instead.
